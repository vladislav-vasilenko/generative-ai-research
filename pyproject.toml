[project]
name = "generative-ai-research"
version = "0.1.0"
description = "Russian learning labs for ODEs, SDEs and diffusion models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    "scipy>=1.11,<2",
    "tqdm>=4.66,<5",
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<0.11",
    "nbconvert>=7.16,<8",
]

[project.optional-dependencies]
ddpm = ["torchvision>=0.19,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
