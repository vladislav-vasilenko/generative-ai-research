[project]
name = "kandinsky-learning-labs"
version = "0.1.0"
description = "Kandinsky 5 Lite learning labs with pinned model dependencies"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.56.2",
    "diffusers==0.35.1",
    "accelerate>=1.10,<2",
    "huggingface-hub>=0.34,<1",
    "safetensors>=0.6,<1",
    "omegaconf==2.3.1",
    "einops>=0.8,<1",
    "numpy>=1.26,<3",
    "matplotlib>=3.9,<4",
    "pillow>=10,<13",
    "jupyterlab>=4,<5",
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "imageio>=2.35,<3",
    "imageio-ffmpeg>=0.6,<1",
    "psutil>=6,<8",
    "sentencepiece>=0.2,<1",
]

[tool.uv]
package = false
